<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; background: linear-gradient(180deg, #4ade80 0%, #166534 60%, #022c22 100%); background-attachment: fixed; min-height: 100vh; color: #333; overflow-x: hidden; }
    .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(5px); border-radius: 12px; transition: all 0.2s; }
    .glass-card:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
    .mask-panel { background: rgba(2, 44, 34, 0.85); backdrop-filter: blur(10px); color: white; border-radius: 24px; border: 1px solid rgba(255,255,255,0.1); }
  </style>
</head>
<body class="flex flex-col items-center pt-24 px-4 pb-32">

  <div class="text-center text-white mb-6 relative w-full max-w-4xl">
    <h1 class="text-5xl font-bold mb-2 drop-shadow-md">CS Internal Search</h1>
  </div>

  <div class="w-full max-w-7xl grid grid-cols-1 lg:grid-cols-4 gap-8">
    <div class="lg:col-span-1">
      <div class="mask-panel p-6 shadow-2xl">
        <h2 class="text-xl font-bold mb-4 flex items-center gap-2 text-green-400"><i class="fas fa-user-shield"></i> Multi-Masking</h2>
        <textarea id="maskInput" onkeyup="handleMask()" rows="6" class="w-full p-4 rounded-xl text-gray-900 text-sm outline-none focus:ring-2 focus:ring-green-400" placeholder="วาง Email หรือ เบอร์โทร..."></textarea>
        <div class="mt-4">
          <div class="flex justify-between items-center mb-1"><span class="text-[10px] font-bold text-gray-400 uppercase">Output</span></div>
          <pre id="maskOutput" class="p-3 bg-black/30 rounded-xl text-[13px] text-green-300 font-mono min-h-[100px] whitespace-pre-wrap"></pre>
        </div>
      </div>
    </div>

    <div class="lg:col-span-3">
      <div class="search-box-container mb-12">
        <input type="text" id="searchInput" onkeyup="renderData()" placeholder="พิมพ์สิ่งที่ต้องการค้นหา..." class="w-full py-5 px-10 rounded-full text-gray-700 text-xl shadow-2xl outline-none focus:ring-4 focus:ring-green-300/50">
      </div>
      <div id="resultContainer" class="space-y-4"></div>
    </div>
  </div>

  <script>
    function handleMask() {
      const val = document.getElementById('maskInput').value;
      if(!val.trim()) { document.getElementById('maskOutput').innerText = ""; return; }
      google.script.run.withSuccessHandler(res => { document.getElementById('maskOutput').innerText = res; }).maskDataFromWeb(val);
    }
  </script>
</body>
</html>
